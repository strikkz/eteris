name: Catalog dump
on:
  push:
    branches: [ logos ]
    paths: [ "tools/catalog_dump.sh" ]
permissions:
  contents: write
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tools/catalog_dump.sh
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/catalog_dump.txt tools/pages || true; git add tools/catalog_dump.txt && git commit -m "Catalog dump" && git push
