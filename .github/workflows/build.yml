# Builds the Eteris APK automatically on every change and publishes it on the "Releases" page.
name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk "Eteris-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Eteris-apk
          path: Eteris-*.apk

      - name: Publish on the Releases page
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Eteris 1.0.${{ github.run_number }}
          files: Eteris-*.apk
          make_latest: true
