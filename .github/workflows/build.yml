# Builds the Eteris APK automatically on every change and publishes it on the "Releases" page.
name: Build APK

on:
  push:
    branches: [ main, banga ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk "BANGA-2.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Eteris-apk
          path: BANGA-*.apk

      - name: Publish on the Releases page
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: BANGA 2.0.${{ github.run_number }}
          files: BANGA-*.apk
          make_latest: true

      # The BANGA site gets the newest APK (fixed download link) and update.json, which the app
      # reads in Settings to offer the update with what changed. The site branch keeps no history.
      - name: Publish on the BANGA site
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin gh-pages --depth=1
          git worktree add pages FETCH_HEAD
          cp -r web/. pages/
          cp "BANGA-2.0.${{ github.run_number }}.apk" pages/banga.apk
          python3 tools/update_json.py pages/update.json changelog.json ${{ github.run_number }}
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan site
          git add -A
          git commit -qm "BANGA site, version 2.0.${{ github.run_number }}"
          git push -q -f origin site:gh-pages
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
