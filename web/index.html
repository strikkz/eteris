<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0D0D">
<meta name="description" content="BANGA — Lietuvos radijo stotys geriausia kokybe.">
<title>BANGA</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%230B0D0D'/%3E%3Cpath d='M60,256c42,0 42,-95 98,-95s42,190 98,190 42,-190 98,-190 42,95 98,95' fill='none' stroke='%23DFFF63' stroke-width='58' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<style>
:root{
  --bg:#0B0D0D; --surface:#171B1A; --raised:#212624; --text:#F4F7EF; --text2:#A6ADA7; --muted:#747979;
  --accent:#DFFF63; --on-accent:#10140B; --outline:#343B37; --error:#FF8F89;
  --side:max(18px, env(safe-area-inset-left, 0px));
  --font:"Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.43 var(--font);min-height:100dvh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:inherit}
img{max-width:100%;display:block}

/* ---------- layout ---------- */
.shell{max-width:1180px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-right,0px)) 210px var(--side)}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(env(safe-area-inset-top,0px) + 18px) 0 4px}
.wordmark{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;letter-spacing:-.04em}
.wordmark svg{width:26px;height:26px}
.topnav{display:none;gap:4px;background:var(--surface);border-radius:999px;padding:4px}
.topnav button{padding:9px 18px;border-radius:999px;font-weight:700;color:var(--text2)}
.topnav button[aria-current=true]{background:var(--accent);color:var(--on-accent)}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%}
.icon-btn:hover{background:var(--surface)}
.date{color:var(--text2);margin:28px 0 6px}
.display{font-size:clamp(40px,7vw,64px);line-height:.98;font-weight:800;letter-spacing:-.06em;margin:0 0 6px;text-wrap:balance}
.display span{color:var(--accent);display:block}
.section-h{display:flex;align-items:center;justify-content:space-between;margin:30px 0 12px}
.section-h h2{font-size:17px;line-height:22px;font-weight:700;letter-spacing:-.03em;margin:0}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}

.home-grid{display:grid;gap:0 28px}
.home-grid>div,.rows-2>*{min-width:0}
@media (min-width:900px){
  .topnav{display:flex}
  .nav{display:none!important}
  .home-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}
  .rows-2{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
  .shell{padding-bottom:140px}
}

/* ---------- hero ---------- */
.hero{position:relative;height:300px;border-radius:28px;overflow:hidden;cursor:pointer;isolation:isolate;
  background:radial-gradient(circle at 70% 30%,var(--c-light),var(--c-mid) 40%,var(--c-dark) 75%,#0B191C);transition:background .5s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,transparent 35%,rgba(0,19,16,.9));z-index:-1}
.hero .ring{position:absolute;right:-40px;top:50%;width:300px;height:300px;transform:translateY(-50%);z-index:-2;opacity:.8}
.hero-top{position:absolute;inset:20px 20px auto;display:flex;justify-content:space-between;align-items:center}
.hero-bottom{position:absolute;inset:auto 20px 20px;display:flex;align-items:flex-end;gap:12px}
.hero-name{font-weight:800;letter-spacing:-.06em;line-height:1;text-transform:uppercase;color:#fff;margin:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.hero-sub{color:#D3E0D5;font-size:12px;font-weight:500;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;background:rgba(0,0,0,.45);font-size:10px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
.live i{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.play{flex:none;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;transition:transform .15s}
.play:hover{transform:scale(1.05)}
.play svg{width:42%;height:42%}

/* ---------- art ---------- */
.art{flex:none;border-radius:var(--r,14px);overflow:hidden;background:#fff;display:grid;place-items:center}
.art img{width:100%;height:100%;object-fit:cover}
.art.initials{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-weight:800;letter-spacing:-.04em}

/* ---------- chips, tiles ---------- */
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:-5px calc(-1*var(--side));padding:5px var(--side)}
.hscroll::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--outline);font-weight:600;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;background:linear-gradient(135deg,var(--g1),var(--g2))}
.tile{flex:none;width:96px;text-align:left}
.tile .art{width:96px;height:96px;--r:20px;position:relative}
.tile.on .art{outline:2px solid var(--accent);outline-offset:2px}
.tile span{display:block;margin-top:8px;font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.genres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gtile{height:96px;border-radius:20px;padding:14px;text-align:left;font-weight:800;font-size:16px;letter-spacing:-.03em;line-height:1.1;
  background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;display:flex;align-items:flex-end;text-shadow:0 1px 8px rgba(0,0,0,.25)}
.gtile[aria-pressed=true]{outline:2px solid var(--accent);outline-offset:3px}

/* ---------- station rows ---------- */
.row{display:flex;align-items:center;gap:14px;padding:9px 8px;margin:0 -8px;border-radius:18px;cursor:pointer}
.row:hover{background:var(--surface)}
.row.on{background:var(--surface)}
.row .art{width:52px;height:52px}
.row .meta{flex:1;min-width:0}
.row b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{display:block;color:var(--text2);font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.on small{color:var(--accent)}
.heart{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--text2)}
.heart[aria-pressed=true]{color:var(--accent)}
.heart.pulse svg{animation:pulse .35s}
@keyframes pulse{50%{transform:scale(1.35)}}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:10px;margin-right:6px;vertical-align:-1px}
.eq i{width:2px;background:var(--accent);animation:eq 1s infinite ease-in-out}
.eq i:nth-child(2){animation-delay:-.4s}.eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:10px}}

/* ---------- search ---------- */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--outline);border-radius:18px;padding:0 14px;height:52px;margin-top:22px}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;font-size:15px;outline:none}
.search input::placeholder{color:var(--muted)}
.search input::-webkit-search-cancel-button{display:none}
.scope{display:flex;background:var(--surface);border-radius:999px;padding:4px;margin-top:18px}
.scope button{flex:1;height:42px;border-radius:999px;font-weight:700;font-size:12px;color:var(--text2)}
.scope button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.hint{color:var(--text2);font-size:12px;margin:10px 0 0}
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--outline);border-radius:24px;margin-top:20px}
.empty h3{margin:0 0 6px;font-size:17px}
.empty p{color:var(--text2);margin:0 0 18px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:999px;background:var(--surface);border:1px solid var(--outline);font-weight:700;text-decoration:none}
.pill.accent{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.note{display:flex;gap:10px;align-items:center;margin-top:16px;padding:12px 14px;border-radius:16px;background:#2a1716;color:var(--error)}
.loading{height:300px;border-radius:28px;background:var(--surface);display:grid;place-items:center;color:var(--text2)}

/* ---------- dock ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:18px max(14px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,transparent,rgba(11,13,13,.92) 12%,var(--bg));display:grid;gap:9px}
.dock>*{width:100%;max-width:1180px;margin:0 auto}
.mini{display:flex;align-items:center;gap:12px;padding:8px 8px 8px 8px;border-radius:22px;background:var(--raised);cursor:pointer;
  box-shadow:0 10px 30px rgba(0,0,0,.4)}
.mini .art{width:48px;height:48px;--r:14px}
.mini .meta{flex:1;min-width:0}
.mini b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini small{display:block;color:var(--text2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .ctl{display:flex;align-items:center;gap:4px}
.mini .vol{display:none;align-items:center;gap:8px;color:var(--text2)}
@media (min-width:900px){.mini .vol{display:flex}}
input[type=range]{accent-color:var(--accent);width:110px}
.nav{display:flex;justify-content:space-around;background:var(--surface);border-radius:999px;padding:6px}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:999px;color:var(--text2);font-size:11px;font-weight:700}
.nav button[aria-current=true]{color:var(--on-accent);background:var(--accent)}
.nav svg{width:20px;height:20px}

/* ---------- player ---------- */
.overlay{position:fixed;inset:0;z-index:40;overflow-y:auto;transition:transform .34s cubic-bezier(.2,.8,.2,1),opacity .24s}
.overlay.closed{transform:translateY(100%);opacity:0;pointer-events:none}
.player{background:radial-gradient(ellipse at 50% 0%,color-mix(in srgb,var(--c-mid) 88%,var(--bg)),color-mix(in srgb,var(--c-dark) 93%,var(--bg)) 55%,rgba(11,13,13,.97) 90%);
  -webkit-backdrop-filter:none;backdrop-filter:none}
.player-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(22px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(22px,env(safe-area-inset-left,0px))}
.player-head{display:flex;align-items:center;justify-content:space-between}
.player-head .eyebrow{color:var(--text2)}
.cover{margin:22px auto 0;width:min(78vw,340px,40vh);aspect-ratio:1;--r:32px;box-shadow:0 30px 60px rgba(0,0,0,.45);cursor:pointer}
.cover-hint{display:block;margin:10px auto 0;color:var(--text2);font-size:12px;font-weight:600}
.p-name{font-size:30px;line-height:1.05;font-weight:800;letter-spacing:-.05em;margin:22px 0 4px;text-wrap:balance}
.p-song{color:var(--text2);font-size:15px;min-height:22px}
.p-meta{display:flex;align-items:center;gap:10px;margin-top:10px;color:var(--text2);font-size:12px;font-weight:600}
.wave{height:22px;margin-top:20px;width:100%}
.p-ctl{display:flex;align-items:center;justify-content:center;gap:26px;margin-top:16px}
.p-ctl .icon-btn{width:56px;height:56px}
.p-ctl .icon-btn svg{width:30px;height:30px}
.p-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:22px}
.about{margin-top:18px;padding:18px;border-radius:22px;background:rgba(0,0,0,.35);line-height:1.55}
.about h3{margin:0 0 8px;font-size:15px}
.about p{margin:0 0 14px;color:#D9DED8;max-width:65ch}
.menu{position:relative}
.menu-list{position:absolute;bottom:52px;left:0;background:var(--raised);border-radius:16px;padding:6px;min-width:190px;box-shadow:0 14px 40px rgba(0,0,0,.5);z-index:2}
.menu-list button{display:block;width:100%;text-align:left;padding:10px 12px;border-radius:10px}
.menu-list button:hover{background:var(--surface)}

/* ---------- settings ---------- */
.settings{background:var(--bg)}
.settings-in{max-width:640px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(18px,env(safe-area-inset-right,0px)) 40px var(--side)}
.card{background:var(--surface);border-radius:22px;padding:6px;margin-top:12px}
.opt{display:flex;align-items:center;justify-content:space-between;width:100%;padding:13px 14px;border-radius:16px;text-align:left}
.opt:hover{background:var(--raised)}
.opt[aria-checked=true]::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}
.kv{display:flex;justify-content:space-between;padding:13px 14px;color:var(--text2)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:60;background:#DFFF8B;color:var(--on-accent);
  font-weight:700;font-size:12px;padding:12px 18px;border-radius:24px;max-width:calc(100% - 48px);text-align:center}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="wordmark"><svg viewBox="0 0 512 512" aria-hidden="true"><path d="M60,256c42,0 42,-95 98,-95s42,190 98,190 42,-190 98,-190 42,95 98,95" fill="none" stroke="#DFFF63" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="topTitle">banga</span></div>
    <nav class="topnav" id="topnav"></nav>
    <button class="icon-btn" id="btnSettings"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M3,7H21M3,17H21" stroke="#A6ADA7" stroke-width="1.8" stroke-linecap="round"/><circle cx="15" cy="7" r="2.6" fill="#0B0D0D" stroke="#DFFF63" stroke-width="1.8"/><circle cx="8" cy="17" r="2.6" fill="#0B0D0D" stroke="#A6ADA7" stroke-width="1.8"/></svg></button>

</div>

</div>

<div class="toast" id="toast" hidden></div>
<audio id="audio" preload="none"></audio>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {
  get(k, d){ try{ const v = localStorage.getItem("banga."+k); return v == null ? d : JSON.parse(v); }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem("banga."+k, JSON.stringify(v)); }catch{} },
};

/* ================= texts ================= */
let I18N = {}; let lang = "lt";
const LANGS = [["lt","Lietuvių"],["en","English"],["uk","Українська"],["ru","Русский"]];
const t = (k, ...a) => {
  let s = (I18N[lang] && I18N[lang][k]) || (I18N.lt && I18N.lt[k]) || k;
  a.forEach((v, i) => { s = s.replace(new RegExp("%" + (i + 1) + "\\$[sd]"), v); });
  return s;
};
function pickLang(){
  const saved = store.get("lang", null);
  if(saved) return saved;
  const n = (navigator.language || "lt").slice(0, 2).toLowerCase();
  return ({lt:"lt",en:"en",uk:"uk",ru:"ru"})[n] || "lt";
}

/* ================= genres ================= */
const GENRES = {
  POP:{k:"genre_pop",c:["#FF9985","#A8343E"],w:["pop","top 40","top40","chr","hits","charts"]},
  DANCE:{k:"genre_dance",c:["#A470FF","#352061"],w:["dance","electronic","electro","edm","house","techno","trance","club","disco"]},
  ROCK:{k:"genre_rock",c:["#8CAAFF","#263B91"],w:["rock","metal","alternative","indie","punk","hard rock"]},
  RETRO:{k:"genre_retro",c:["#FFDB8D","#AE6B22"],w:["oldies","retro","80s","90s","70s","60s","classic hits","golden oldies"]},
  JAZZ:{k:"genre_jazz",c:["#ACD972","#2F6E4A"],w:["jazz","classical","classic","opera","blues","soul","lounge","chillout"]},
  TALK:{k:"genre_talk",c:["#6FD3C8","#1F5E63"],w:["news","talk","information","public radio"]},
  LITHUANIAN:{k:"genre_lt",c:["#ED9BDA","#712D75"],w:["lithuanian music","lietuviška muzika","lietuviška","folk","estrada"]},
  FAITH:{k:"genre_faith",c:["#9FB7FF","#33406E"],w:["christian","catholic","religious","religion","gospel"]},
  KIDS:{k:"genre_kids",c:["#FFC27A","#B1462C"],w:["kids","children","vaikams"]},
};
const KNOWN = {lrt:["TALK"],ziniu:["TALK"],lrtklasika:["JAZZ"],lrtopus:["ROCK"],lrtlituanica:["TALK"],m1:["POP"],m1plius:["POP"],m1dance:["DANCE"],
  lietus:["LITHUANIAN"],laluna:["POP"],powerhit:["DANCE","POP"],powergold:["RETRO"],radiocentras:["POP"],zip:["POP"],zipiskasetes:["RETRO"],rock:["ROCK"],
  relax:["LITHUANIAN"],relax100hitu:["LITHUANIAN"],relaxsenti:["LITHUANIAN","RETRO"],europeanhit:["POP"],super:["POP"],"3":["POP"],top:["POP"],
  gold:["RETRO"],geras:["RETRO","LITHUANIAN"],kelyje:["LITHUANIAN"],pukas:["LITHUANIAN"],pukas2:["LITHUANIAN"],easy:["POP"],jazz:["JAZZ"],
  marijos:["FAITH"],vaiku:["KIDS"],fiesta:["POP"]};
const NAME_WORDS = [["rock","ROCK"],["metal","ROCK"],["dance","DANCE"],["jazz","JAZZ"],["klasika","JAZZ"],["retro","RETRO"],["gold","RETRO"],["vaik","KIDS"],["kids","KIDS"]];
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
function genresOf(st){
  if(KNOWN[st.id]) return KNOWN[st.id];
  const tags = st.tags, name = st.name.toLowerCase(), found = new Set();
  for(const [g, d] of Object.entries(GENRES)){
    if(d.w.some(w => tags.some(tag => new RegExp("(^|[^\\p{L}0-9])" + reEsc(w) + "($|[^\\p{L}0-9])", "u").test(tag)))) found.add(g);
  }
  NAME_WORDS.forEach(([w, g]) => { if(new RegExp("(^|[^\\p{L}])" + w, "u").test(name)) found.add(g); });
  if(found.has("FAITH")) return ["FAITH"];
  return [...found];
}

/* ================= catalog (same rules as the phone app) ================= */
const PRIORITY = ["LRT Radijas","LRT Klasika","LRT Opus","M-1","Lietus","M-1 Plius","Power Hit Radio","Radiocentras","ZIP FM","Rock FM","Žinių radijas",
  "Relax FM","European Hit Radio","Gold FM","Kelyje","TOP FM","Laluna","Pūkas","Extra FM","Saulės radijas","Marijos radijas","Vilnius FM","Easy FM",
  "Russkoje Radio Baltija","Radio Kaunas","LRT Lituanica"];
const ALIASES = {powerhitradiolithuania:"powerhit",zipfm:"zip",radijostotism1:"m1",radiostotislaluna:"laluna",radijostotisradio3:"3",
  radijostotiskelyje:"kelyje",goldfm:"gold",pmrworldmusic:"pmr",puko:"pukas"};
const BLOCKED = [/leviracloud\.eu\/phr/i];
const NOT_LT_NAMES = ["Радио Лента","Радио Свободынх Народов","Fréquence Protestante","Christmas Radio","Monsters FM","Leproradio","X-RADIO"];
let NOT_LT = null;
const M1_SERVER = /m-1\.fm\/([^/]+)\//i;
const EXTRA = {m1:[{url:"https://radio.m-1.fm/m1/MP3320",codec:"MP3",br:320,hls:false,ok:true}],
               lietus:[{url:"https://radio.m-1.fm/lietus/MP3320",codec:"MP3",br:320,hls:false,ok:true}]};
const SERVERS = ["de1","de2","fi1","at1","nl1"].map(s => `https://${s}.api.radio-browser.info`);
const CATALOG = "/json/stations/bycountrycodeexact/LT?hidebroken=true&order=clickcount&reverse=true&limit=400";
const LOGOS = new Set();

function norm(s){
  let x = s.toLowerCase().normalize("NFD").replace(/\p{M}+/gu, "");
  x = x.replace(/\[[^\]]*]|\([^)]*\)/g, " ");
  x = x.replace(/\b\d+\s*k(bps|b\/s)?\b/g, " ");
  x = x.replace(/\b(lt|lietuva|radijas|radio|fm|online|aac\+?|aacp|he-?aac|mp3|ogg|flac|hq|hd|high|low|stream)\b/g, " ");
  let k = x.replace(/[^a-z0-9]+/g, "");
  if(!k) k = [...s.toLowerCase()].filter(c => /[\p{L}\p{N}]/u.test(c)).join("");
  return ALIASES[k] || k;
}
const prioKeys = PRIORITY.map(norm);
function brFromUrl(u){ const m = u.replace(/^[a-z]+:\/\/[^/]*\//i, "").match(/(?<!\d)(48|56|64|96|112|128|160|192|256|320)(?!\d)/); return m ? +m[0] : 0; }
function score(v){
  const eff = v.br > 0 ? v.br : v.hls ? 192 : 96;
  const bonus = /FLAC/.test(v.codec) ? 60 : /AAC|OPUS/.test(v.codec) ? 20 : 0;
  return (v.ok ? 0 : 1e5) - eff * 10 - bonus - (v.url.startsWith("https") ? 1 : 0);
}
function parse(arr){
  const groups = new Map();
  for(const o of arr){
    let url = (o.url_resolved || o.url || "").trim();
    if(!/^https?:/.test(url) || BLOCKED.some(r => r.test(url))) continue;
    // The page itself is https, so plain-http streams are tried over https (most servers accept it).
    if(url.startsWith("http:")) url = "https:" + url.slice(5);
    const name = (o.name || "").trim(), byName = norm(name);
    const m = url.match(M1_SERVER); const owner = m ? norm(m[1]) : "";
    const key = owner || byName; if(!key) continue;
    if(!NOT_LT) NOT_LT = new Set(NOT_LT_NAMES.map(norm));
    if(NOT_LT.has(key)) continue;
    const relabeled = key !== byName;
    let codec = (o.codec || "").toUpperCase(); if(codec === "UNKNOWN") codec = "";
    let br = +o.bitrate || 0; if(br > 512) br = 0; if(!br) br = brFromUrl(url);
    const hls = o.hls === 1 || /\.m3u8/i.test(url), ok = o.lastcheckok !== 0;
    if(!groups.has(key)) groups.set(key, {key, name: relabeled ? key : name, fav: null, votes: 0, vars: [], tags: new Set(), home: null});
    const g = groups.get(key); g.votes += +o.clickcount || 0;
    if(!g.vars.some(v => v.url === url)) g.vars.push({url, codec, br, hls, ok});
    if(relabeled) continue;
    if(!g.fav && /^https?:/.test(o.favicon || "")) g.fav = o.favicon;
    if(!g.home && /^https?:/.test(o.homepage || "")) g.home = o.homepage;
    (o.tags || "").toLowerCase().split(",").map(s => s.trim()).filter(Boolean).forEach(s => g.tags.add(s));
  }
  for(const [k, ex] of Object.entries(EXTRA)){ const g = groups.get(k); if(g) ex.forEach(e => { if(!g.vars.some(v => v.url.toLowerCase() === e.url.toLowerCase())) g.vars.push(e); }); }
  return [...groups.values()].map(g => {
    const p = prioKeys.indexOf(g.key);
    const st = {id: g.key, name: p >= 0 ? PRIORITY[p] : g.name, fav: g.fav, home: g.home, votes: g.votes,
      prio: p < 0 ? 999 : p, tags: [...g.tags], vars: g.vars.sort((a, b) => score(a) - score(b))};
    st.genres = genresOf(st);
    return st;
  }).sort((a, b) => a.prio - b.prio || b.votes - a.votes);
}
async function fetchCatalog(){
  for(const base of SERVERS.sort(() => Math.random() - .5)){
    try{
      const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 8000);
      const r = await fetch(base + CATALOG, {signal: ctl.signal}); clearTimeout(tm);
      if(r.ok){ const j = await r.json(); if(Array.isArray(j) && j.length) return j; }
    }catch{}
  }
  return null;
}

function initials(name){ const w = name.replace(/[^\p{L}\p{N} ]/gu, " ").split(/\s+/).filter(Boolean); return ((w[0]||"")[0]||"").toUpperCase() + ((w[1]||"")[0]||"").toUpperCase(); }
function hue(s){ let h = 2166136261; for(const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h % 360; }
function art(st, size, r){
  const style = `width:${size}px;height:${size}px;--r:${r}px`;
  if(st.world && st.favs && st.favs.length){
    const h = hue(st.id), c = logoCandidates(st);
    return `<div class="art" style="${style};--a1:hsl(${h} 70% 55%);--a2:hsl(${(h + 40) % 360} 60% 25%);font-size:${Math.round(size * .36)}px" data-ini="${esc(initials(st.name))}">` +
      `<img src="${esc(c[0])}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-alt="${esc(JSON.stringify(c.slice(1)))}" onerror="window.bangaLogoFail(this)" onload="window.bangaLogoOk(this)"></div>`;
  }
  if(st.world){ const h = hue(st.id);
    return `<div class="art initials" style="${style};--a1:hsl(${h} 70% 55%);--a2:hsl(${(h + 40) % 360} 60% 25%);font-size:${Math.round(size * .36)}px">${esc(initials(st.name))}</div>`; }
  if(LOGOS.has(st.id)) return `<div class="art" style="${style}"><img src="logos/${encodeURIComponent(st.id)}.png" alt="" loading="lazy" decoding="async"></div>`;
  const h = hue(st.id);
  return `<div class="art initials" style="${style};--a1:hsl(${h} 70% 55%);--a2:hsl(${(h + 40) % 360} 60% 25%);font-size:${Math.round(size * .36)}px">${esc(initials(st.name))}</div>`;
}
/* World logos: catalog picture, then the same picture through an image proxy (reaches blocked sites,
   converts ICO/SVG/WebP), then initials. */
function proxied(u){ return "https://images.weserv.nl/?url=" + encodeURIComponent(u.replace(/^https?:\/\//, "")) + "&w=256&h=256&fit=contain&output=png"; }
function logoCandidates(st){ const f = (st.favs || []).filter(u => /^https?:/.test(u)); return [...f.map(u => u.replace(/^http:/, "https:")), ...f.map(proxied)]; }
window.bangaLogoFail = img => {
  let rest = []; try{ rest = JSON.parse(img.dataset.alt || "[]"); }catch{}
  if(rest.length){ img.dataset.alt = JSON.stringify(rest.slice(1)); img.src = rest[0]; return; }
  const box = img.parentElement; img.remove();
  box.classList.add("initials"); box.textContent = box.dataset.ini || "";
};
window.bangaLogoOk = img => {
  if(img.naturalWidth < 48 || img.naturalHeight < 48){ window.bangaLogoFail(img); return; }
  img.style.objectFit = "contain"; img.style.background = "#fff";
};
const colorCache = {};
const DEFAULT_C = {light:"#D6FF8A", mid:"#72A359", dark:"#153B39"};
function colorsOf(st){
  if(colorCache[st.id]) return Promise.resolve(colorCache[st.id]);
  if(!LOGOS.has(st.id)){ const h = hue(st.id); return Promise.resolve(colorCache[st.id] = {light:`hsl(${h} 80% 72%)`, mid:`hsl(${h} 60% 45%)`, dark:`hsl(${h} 50% 16%)`}); }
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      try{
        const c = document.createElement("canvas"); c.width = c.height = 32; const x = c.getContext("2d");
        x.drawImage(img, 0, 0, 32, 32); const d = x.getImageData(0, 0, 32, 32).data;
        // Most saturated, not-too-dark/light pixels decide the colour (like Palette's vibrant swatch).
        let best = null, bestScore = -1; const buckets = {};
        for(let i = 0; i < d.length; i += 4){
          if(d[i + 3] < 128) continue;
          const [hh, ss, ll] = rgb2hsl(d[i], d[i + 1], d[i + 2]);
          if(ll < .12 || ll > .9 || ss < .25) continue;
          const b = Math.round(hh / 20); buckets[b] = buckets[b] || {n:0, h:0, s:0, l:0};
          const B = buckets[b]; B.n++; B.h += hh; B.s += ss; B.l += ll;
        }
        for(const B of Object.values(buckets)){ const sc = B.n * (B.s / B.n); if(sc > bestScore){ bestScore = sc; best = B; } }
        if(!best){ res(colorCache[st.id] = DEFAULT_C); return; }
        const h = best.h / best.n, s = Math.min(90, best.s / best.n * 100);
        res(colorCache[st.id] = {light:`hsl(${h} ${s}% 72%)`, mid:`hsl(${h} ${s}% 46%)`, dark:`hsl(${h} ${Math.min(s, 60)}% 15%)`});
      }catch{ res(colorCache[st.id] = DEFAULT_C); }
    };
    img.onerror = () => res(colorCache[st.id] = DEFAULT_C);
    img.src = `logos/${encodeURIComponent(st.id)}.png`;
  });
}
function rgb2hsl(r, g, b){
  r /= 255; g /= 255; b /= 255; const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
  if(mx === mn) return [0, 0, l];
  const d = mx - mn, s = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
  const h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
  return [h * 60, s, l];
}

async function searchWorld(q){

  if(wCache[key]){ S.wres = wCache[key]; S.wloading = false; S.wfail = false; if(S.tab === "explore" && S.scope === "world") renderExplore(wFocused()); return; }
  S.wloading = true; S.wfail = false;
  const c = "hidebroken=true&order=clickcount&reverse=true", e = encodeURIComponent(q);
  const paths = q ? [`/json/stations/search?name=${e}&${c}&limit=100`, `/json/stations/search?country=${e}&${c}&limit=80`, `/json/stations/search?tag=${e}&${c}&limit=60`]

function parseWorld(arr){
  if(!NOT_LT) NOT_LT = new Set(NOT_LT_NAMES.map(norm));
  const groups = new Map(), seen = new Set();
  for(const o of arr){
    if(!o.stationuuid || seen.has(o.stationuuid)) continue; seen.add(o.stationuuid);
    const cc = (o.countrycode || "").toUpperCase(), name = (o.name || "").trim();
    if(!name || (cc === "LT" && !NOT_LT.has(norm(name)))) continue;
    let url = (o.url_resolved || o.url || "").trim(); if(!/^https?:/.test(url)) continue;
    if(url.startsWith("http:")) url = "https:" + url.slice(5);
    const key = norm(name) + "|" + cc;
    let codec = (o.codec || "").toUpperCase(); if(codec === "UNKNOWN") codec = "";
    let br = +o.bitrate || 0; if(br > 512) br = 0; if(!br) br = brFromUrl(url);
    if(!groups.has(key)) groups.set(key, {id: "w-" + o.stationuuid, name, cc, favs: [], home: null, votes: 0, vars: [], tags: new Set()});
    const g = groups.get(key); g.votes += +o.clickcount || 0;
    if(!g.vars.some(v => v.url === url)) g.vars.push({url, codec, br, hls: o.hls === 1 || /\.m3u8/i.test(url), ok: o.lastcheckok !== 0});

const audio = $("audio");

function setStatus(s){ if(S.status === s) return; S.status = s; render(); }
function play(list, id){
  const st = getSt(id); if(!st) return;
  S.queue = (list && list.length ? list : [st]).map(s => s.id);
  if(!S.queue.includes(id)) S.queue.unshift(id);
  if(S.cur && S.cur.id === id && S.status !== "idle" && S.status !== "error"){ toggle(); return; }
  S.cur = st; S.song = ""; S.history = [id, ...S.history.filter(x => x !== id)].slice(0, 20);

}
async function loadHls(){
  if(window.Hls) return;

    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"; sc.onload = res; sc.onerror = rej; document.head.appendChild(sc); });
}
async function start(){

  npStop(); S.status = "connecting"; render();

  try{
    let useHls = false;
    if(v.hls){ try{ await loadHls(); useHls = window.Hls && Hls.isSupported(); }catch{} }
    if(useHls){

      hls.on(Hls.Events.MANIFEST_PARSED, (e, d) => { let b = 0; d.levels.forEach((l, i) => { if(l.bitrate > d.levels[b].bitrate) b = i; }); hls.nextLevel = b; });

function fail(){

}
function toggle(){

  } else {
    wantPlay = true;

    else { audio.play().catch(() => start()); if(S.cur.vars[variantIdx] && !S.cur.vars[variantIdx].hls) npStart(S.cur, S.cur.vars[variantIdx]); }

}
function step(d){
  const q = S.queue.length ? S.queue : popular().map(s => s.id);
  if(!q.length) return;
  let i = S.cur ? q.indexOf(S.cur.id) : -1;

/* ---------- now playing (song title) ---------- */
const NP = {timer: 0, token: 0, last: null};
function cleanTitle(x, st){
  x = (x || "").replace(/\s+/g, " ").trim();
  if(!x || x === "-" || /^(unknown|untitled|n\/a)$/i.test(x)) return "";
  if(norm(x) === st.id || x.toLowerCase() === st.name.toLowerCase()) return "";
  if(/^https?:\/\//i.test(x)) return "";
  return x.replace(/\s+-\s+/, " — ");
}
function setSong(x){
  const st = S.cur; if(!st) return; x = cleanTitle(x, st);
  if(x === NP.last) return; NP.last = x; S.song = x; updateSongText();
}
function npStop(){ clearTimeout(NP.timer); NP.token++; NP.last = null; S.song = ""; }
async function tfetch(url, ms = 6000){
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), ms);
  try{ return await fetch(url, {signal: ctl.signal, cache: "no-store"}); } finally { clearTimeout(tm); }
}
const NPM = {
  async icecast(url){
    const u = new URL(url); const r = await tfetch(u.origin + "/status-json.xsl"); if(!r.ok) return null;
    let src = (await r.json())?.icestats?.source; if(!src) return null; if(!Array.isArray(src)) src = [src];
    const m = src.find(x => { try{ return new URL(x.listenurl).pathname === u.pathname; }catch{ return false; } }) || (src.length === 1 ? src[0] : null);
    if(!m) return null; if(m.artist && m.title) return `${m.artist} - ${m.title}`; return m.title || m.yp_currently_playing || "";
  },
  async shoutcast(url){
    const u = new URL(url); const r = await tfetch(u.origin + "/stats?sid=1&json=1"); if(!r.ok) return null;
    const j = await r.json(); return typeof j.songtitle === "string" ? j.songtitle : null;
  },
  async icy(url){
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 9000);
    try{
      const r = await fetch(url, {headers: {"Icy-MetaData": "1"}, signal: ctl.signal, cache: "no-store"});
      const mi = parseInt(r.headers.get("icy-metaint"), 10); if(!mi || !r.body){ ctl.abort(); return null; }
      const rd = r.body.getReader(); let skip = mi, need = -1, got = 0; const parts = [];
      for(;;){
        const {value, done} = await rd.read(); if(done) return null; let i = 0;
        while(i < value.length){
          if(skip > 0){ const n = Math.min(skip, value.length - i); skip -= n; i += n; continue; }
          if(need < 0){ need = value[i] * 16; i++; if(need === 0){ ctl.abort(); return ""; } continue; }
          const n = Math.min(need - got, value.length - i); parts.push(value.slice(i, i + n)); got += n; i += n;
          if(got >= need){
            ctl.abort(); const all = new Uint8Array(got); let o = 0; for(const p of parts){ all.set(p, o); o += p.length; }
            let txt; try{ txt = new TextDecoder("utf-8", {fatal: true}).decode(all); }catch{ txt = new TextDecoder("windows-1257").decode(all); }
            const m = txt.match(/StreamTitle='([\s\S]*?)';/); return m ? m[1] : "";
          }
        }
      }
    } finally { clearTimeout(tm); }
  },
};
const npMethod = {};
function npStart(st, v){
  const tok = NP.token; let methods = npMethod[st.id] ? [npMethod[st.id]] : ["icecast", "shoutcast", "icy"]; let misses = 0;
  const loop = async () => {
    if(tok !== NP.token) return; let found = false;
    for(const m of methods){
      try{ const x = await NPM[m](v.url); if(tok !== NP.token) return;
        if(x != null){ npMethod[st.id] = m; methods = [m]; setSong(x); found = true; break; } }catch{}
    }
    if(!found) misses++;
    if(tok === NP.token && misses < 2) NP.timer = setTimeout(loop, found ? 20000 : 30000);
  };
  loop();
}
function id3Title(b){
  if(!b || b.length < 10 || b[0] !== 0x49 || b[1] !== 0x44 || b[2] !== 0x33) return null;
  const ver = b[3], ss = o => (b[o] << 21) | (b[o + 1] << 14) | (b[o + 2] << 7) | b[o + 3];
  const end = Math.min(b.length, 10 + ss(6)); let p = 10, title = "", artist = "";
  const dec = (enc, d) => { const l = enc === 0 ? "latin1" : enc === 3 ? "utf-8" : enc === 2 ? "utf-16be" : "utf-16"; try{ return new TextDecoder(l).decode(d).replace(/\0+$/, ""); }catch{ return ""; } };
  while(p + 10 <= end){
    const id = String.fromCharCode(b[p], b[p + 1], b[p + 2], b[p + 3]);
    const size = ver === 4 ? ss(p + 4) : (b[p + 4] << 24) | (b[p + 5] << 16) | (b[p + 6] << 8) | b[p + 7];
    if(!/^[A-Z0-9]{4}$/.test(id) || size <= 0) break;
    const d = b.subarray(p + 10, p + 10 + size), txt = dec(d[0], d.subarray(1));
    if(id === "TIT2") title = txt; else if(id === "TPE1") artist = txt;
    p += 10 + size;
  }
  if(!title && !artist) return null;
  return artist && title ? `${artist} - ${title}` : title || artist;
}

/* ---------- sleep timer: fades out, then pauses ---------- */
let sleepTimer = 0;
function setSleep(min){

  if(min){ sleepTimer = setTimeout(fadeOut, min * 60000); toast(t("sleep_set", min)); }
  render();

function fadeOut(){
  const v0 = audio.volume; let i = 0;
  const f = setInterval(() => {
    i++; audio.volume = Math.max(0, v0 * (1 - i / 30));
    if(i >= 30){ clearInterval(f); if(S.status === "playing") toggle(); audio.volume = v0; S.sleepAt = 0; render(); }
  }, 200);
}

/* ---------- live wave line in the player ---------- */
let wavePhase = 0;
function drawWave(){
  const w = $("wave");
  if(w && S.playerOpen){
    const live = S.status === "playing"; wavePhase += live ? .08 : 0;
    let d = "M0 11";
    for(let x = 0; x <= 400; x += 8){
      const amp = live ? 4 + 3 * Math.sin(x / 47 + wavePhase * .7) : .5;
      d += ` L${x} ${(11 + amp * Math.sin(x / 18 + wavePhase * 2)).toFixed(2)}`;
    }
    w.firstElementChild.setAttribute("d", d);
  }
  requestAnimationFrame(drawWave);
}

/* ================= overlays ================= */
function openPlayer(){ if(!S.cur) return; S.playerOpen = true; S.aboutOpen = false; renderPlayer(); $("player").classList.remove("closed"); document.body.style.overflow = "hidden"; }
function closePlayer(){ S.playerOpen = false; $("player").classList.add("closed"); if(!S.settingsOpen) document.body.style.overflow = ""; }
function openSettings(){ S.settingsOpen = true; renderSettings(); $("settings").classList.remove("closed"); document.body.style.overflow = "hidden"; }
function closeSettings(){ S.settingsOpen = false; $("settings").classList.add("closed"); if(!S.playerOpen) document.body.style.overflow = ""; }
let toastTimer = 0;
function toast(msg){ const el = $("toast"); el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.hidden = true, 3500); }

/* ================= events ================= */
function listFor(name){
  return ({popular: popular(), recent: recent(), favs: favList(), filtered: filtered(), world: S.wres || []})[name] || [];
}
function toggleFav(id, btn){
  S.favs = isFav(id) ? S.favs.filter(x => x !== id) : [id, ...S.favs]; store.set("favs", S.favs);
  if(id.startsWith("w-")) saveWorld();
  render();
  const again = document.querySelector(`[data-fav="${CSS.escape(id)}"]`); if(again && isFav(id)) again.classList.add("pulse");
}
document.addEventListener("click", e => {
  const el = e.target.closest("button,[data-play],[data-open]"); if(!el) {
    if(!e.target.closest(".menu")) { const m = $("sleepMenu"); if(m) m.hidden = true; }
    return;
  }
  if(el.dataset.fav != null){ e.stopPropagation(); toggleFav(el.dataset.fav, el); return; }
  if(el.dataset.tab){ S.tab = el.dataset.tab; render(); window.scrollTo({top: 0}); closeSettings(); return; }
  if(el.dataset.scope){ S.scope = el.dataset.scope; render(); return; }
  if(el.dataset.genre){
    const g = el.dataset.genre;
    if(el.classList.contains("gtile")) S.genre = S.genre === g ? null : g;
    else { S.genre = g; S.query = ""; S.tab = "explore"; window.scrollTo({top: 0}); }
    render(); return;
  }
  if(el.dataset.heroplay){ e.stopPropagation(); const id = el.dataset.heroplay; play(S.cur && S.cur.id === id ? S.queue.map(getSt).filter(Boolean) : recent().length ? recent() : popular(), id); return; }
  if(el.dataset.open){ const id = el.dataset.open; if(!S.cur || S.cur.id !== id || S.status === "idle") play(recent().length ? recent() : popular(), id); openPlayer(); return; }
  if(el.dataset.play){ play(listFor(el.dataset.list), el.dataset.play); return; }
  if(el.dataset.sleep != null){ setSleep(+el.dataset.sleep); return; }
  if(el.dataset.lang != null){ const c = el.dataset.lang; store.set("lang", c || null); lang = c || pickLang(); render(); return; }
  switch(el.id){
    case "btnSettings": openSettings(); break;
    case "sClose": closeSettings(); break;
    case "miniPlay": case "pPlay": e.stopPropagation(); toggle(); break;
    case "miniNext": e.stopPropagation(); step(1); break;
    case "retry": e.stopPropagation(); variantIdx = 0; wantPlay = true; start(); break;
    case "pPrev": step(-1); break;
    case "pNext": step(1); break;
    case "pClose": closePlayer(); break;
    case "pOther": closePlayer(); S.tab = "explore"; render(); window.scrollTo({top: 0}); break;
    case "aboutToggle": S.aboutOpen = !S.aboutOpen; renderPlayer(); break;
    case "sleepBtn": { const m = $("sleepMenu"); m.hidden = !m.hidden; break; }
    case "clearQ": case "clearQ2": S.query = ""; S.genre = null; render(); break;
    case "clearW": S.wq = ""; S.wres = null; render(); break;
    case "retryW": S.wfail = false; S.wres = null; render(); break;
  }
});
$("mini").addEventListener("click", e => { if(!e.target.closest("button,input,label")) openPlayer(); });
document.addEventListener("keydown", e => {
  if(e.target.matches("input")) return;
  const el = e.target.closest("[data-play],[data-open]");
  if(el && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); el.click(); return; }
  if(e.key === " "){ e.preventDefault(); toggle(); }
  else if(e.key === "ArrowRight" && S.playerOpen) step(1);
  else if(e.key === "ArrowLeft" && S.playerOpen) step(-1);
  else if(e.key === "Escape"){ if(S.playerOpen) closePlayer(); else if(S.settingsOpen) closeSettings(); }
});
document.addEventListener("input", e => {
  if(e.target.id === "q"){ S.query = e.target.value; renderExplore(true); }
  if(e.target.id === "wq"){ S.wq = e.target.value; clearTimeout(wTimer); wTimer = setTimeout(() => searchWorld(S.wq), 450); }
  if(e.target.id === "vol"){ audio.volume = +e.target.value; store.set("vol", audio.volume); }
});
/* swipe down closes the player */
(() => {
  let y0 = null; const p = $("player");
  p.addEventListener("touchstart", e => { y0 = p.scrollTop <= 0 ? e.touches[0].clientY : null; }, {passive: true});
  p.addEventListener("touchend", e => { if(y0 != null && e.changedTouches[0].clientY - y0 > 110) closePlayer(); y0 = null; });
})();
addEventListener("online", () => { S.online = true; render(); if(!S.stations.length) load(); });
addEventListener("offline", () => { S.online = false; render(); });

/* ================= start ================= */
async function load(){
  const cached = store.get("catalog", null);
  if(cached && cached.length){ apply(cached); }
  const fresh = await fetchCatalog();
  if(fresh){ store.set("catalog", fresh.map(o => ({name:o.name,url:o.url,url_resolved:o.url_resolved,codec:o.codec,bitrate:o.bitrate,hls:o.hls,
    lastcheckok:o.lastcheckok,clickcount:o.clickcount,favicon:o.favicon,homepage:o.homepage,tags:o.tags}))); apply(fresh); }
  S.loading = false; render();
}
function apply(raw){
  const list = parse(raw); if(!list.length) return;
  S.stations = list; S.byId = Object.fromEntries(list.map(s => [s.id, s]));
  if(S.cur) S.cur = S.byId[S.cur.id] || S.cur;
  if(!S.cur){ const last = store.get("last", null); if(last && getSt(last)) S.cur = getSt(last); }
  if(S.cur && S.status === "idle") S.status = "idle";
  render();
}
(async () => {
  try{ const r = await fetch("i18n.json"); I18N = await r.json(); }catch{}
  lang = pickLang();
  try{ const r = await fetch("logos/index.json"); (await r.json()).forEach(id => LOGOS.add(id)); }catch{}
  try{ const r = await fetch("about.json"); S.about = await r.json(); }catch{}
  render(); drawWave(); load();
})();
})();
</script>
